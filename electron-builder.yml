appId: com.local.ai-ide
productName: AI IDE
copyright: Copyright © 2026

directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/node-pty/**/*

# node-pty ships Node-API prebuilds. They do not need an Electron-specific ABI rebuild.
npmRebuild: false

publish:
  provider: github
  owner: wjiwjiwji
  repo: ai-ide
  releaseType: release

win:
  executableName: AI IDE
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AI-IDE-${version}-${arch}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI IDE
  deleteAppDataOnUninstall: false
  runAfterFinish: true
